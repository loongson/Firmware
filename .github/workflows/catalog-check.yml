name: Check firmware catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test catalog rules
        run: |
          python3 scripts/test_manifest.py
          python3 scripts/test_stage_web_images.py
          node --check web/app.js
      - name: Build static site
        run: |
          python3 scripts/generate-manifest.py --output web/manifest.json
          python3 scripts/stage-web-images.py
          node --check web/manifest.js
